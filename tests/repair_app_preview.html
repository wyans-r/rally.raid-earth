<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>rally.raid Earth Repair preview (outside the game)</title>
<link rel="icon" href="data:,">
<script src="https://unpkg.com/angular@1.8.3/angular.min.js"></script>
<style>body{background:#6d7a63;margin:0;font-family:sans-serif} .slot{position:absolute;width:360px;height:300px} #a{left:10px;top:10px} #b{left:380px;top:10px} #c{left:750px;top:10px} #d{left:10px;top:320px;width:540px;height:450px}</style>
<script>
// a stand-in for the game's UI: the 'beamng.apps' module, bngApi, and RallyRaidRepair messages (as repair.lua sends them;
// empty Lua tables arrive as {} and arrays as arrays)
var calls = []
window.bngApi = { engineLua: function (cmd, cb) { calls.push(cmd) } }
angular.module('beamng.apps', [])
</script>
<script src="/ui/modules/apps/RallyRaidRepair/app.js"></script>
</head>
<body ng-app="beamng.apps">
<div class="slot" id="a"><rally-raid-repair></rally-raid-repair></div>
<div class="slot" id="b"><rally-raid-repair></rally-raid-repair></div>
<div class="slot" id="c"><rally-raid-repair></rally-raid-repair></div>
<div class="slot" id="d"><rally-raid-repair></rally-raid-repair></div>
<script>
function stageOpts(sparesLeft) {
  var o = []
  ;['FL', 'FR', 'RL', 'RR'].forEach(function (c, i) { o.push({ id: 'wheel:' + c, group: 'wheel', corner: c, kind: 'wheel', label: 'Change wheel ' + c, minutes: 2, spare: true,
    damage: i === 0 ? 0.62 : 0, flat: i === 0, enabled: sparesLeft > 0, why: sparesLeft > 0 ? undefined : 'no spare wheel left' }) })
  ;['FL', 'FR', 'RL', 'RR'].forEach(function (c, i) { o.push({ id: 'suspension:' + c, group: 'suspension', corner: c, kind: 'suspension', label: 'Suspension ' + c + ' (light)', minutes: 18, damage: i === 0 ? 0.25 : 0, enabled: true }) })
  o.push({ id: 'radiator', group: 'radiator', kind: 'radiator', label: 'Radiator', minutes: 12, damage: 0.4, enabled: true })
  return o
}
var STATES = {
  // closed bar mid-stage
  a: { open: false, mode: 'stage', stopped: false, options: stageOpts(2), resumes: { rally: 1, max: 3, stage: 0, maxStage: 1 }, spares: { used: 0, max: 2 } },
  // bivouac, open, over budget warning possible
  b: { open: true, mode: 'bivouac', stopped: true, resumes: { rally: 2, max: 3 }, spares: { used: 0, max: 2 },
       bivouac: { open: true, usedMin: 150, budgetMin: 180, leftMin: 30, overMin: 0, retireOverMin: 60, engineChanges: 0 },
       options: [ { id: 'whole', kind: 'whole', label: 'Whole-car repair (all but the engine)', minutes: 64, enabled: true,
                    items: [ { what: 'frame', minutes: 30.1 }, { what: 'suspension FL', minutes: 14 }, { what: 'service', minutes: 10 }, { what: 'radiator', minutes: 9.9 } ] },
                  { id: 'engine', kind: 'engine', label: 'Engine change', minutes: 90, penaltyS: 7200, engineFlags: ['headGasketDamaged'], damage: 1, enabled: true } ] },
  // no repairs here
  c: { open: true, mode: 'none', stopped: true, msg: 'No repairs here: run a stage (mid-stage repairs) or finish one (bivouac).', options: {}, resumes: { rally: 0, max: 3 }, spares: { used: 0, max: 2 } },
  // stage, open, stopped, one spare left
  d: { open: true, mode: 'stage', stopped: true, repairTimeS: 840, options: stageOpts(1), resumes: { rally: 1, max: 3, stage: 0, maxStage: 1 }, spares: { used: 1, max: 2 } }
}
function send(id, st) {
  var el = document.querySelector('#' + id + ' .rrr-host')
  angular.element(el).isolateScope().$broadcast('RallyRaidRepair', st)
}
setTimeout(function () { Object.keys(STATES).forEach(function (id) { send(id, STATES[id]) }) }, 300)
</script>
</body></html>
