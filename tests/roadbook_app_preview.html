<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Rally Raid Roadbook + GPS apps preview (outside the game)</title>
<link rel="icon" href="data:,">
<script src="https://unpkg.com/angular@1.8.3/angular.min.js"></script>
<style>body{background:#56614f;margin:0;font-family:sans-serif} .slot{position:absolute} #gps{left:10px;top:10px;width:380px;height:340px} #rb{left:10px;top:360px;width:380px;height:520px}
#rb2{left:400px;top:10px;width:380px;height:520px} #rb3{left:400px;top:540px;width:380px;height:340px} .cap{position:absolute;color:#fff;font:12px sans-serif}</style>
<script>
// a stand-in for the game's UI: the 'beamng.apps' module, bngApi and the RallyRaidUpdate / RallyRaidRoadbook messages
var calls = []
window.bngApi = { engineLua: function (cmd, cb) { calls.push(cmd); if (cb) cb([]) } }
angular.module('beamng.apps', [])
</script>
<script src="/ui/modules/apps/RallyRaidGPS/app.js"></script>
<script src="/ui/modules/apps/RallyRaidRoadbook/app.js"></script>
</head>
<body ng-app="beamng.apps">
<div class="slot" id="gps"><rally-raid-gps></rally-raid-gps></div>
<div class="slot" id="rb"><rally-raid-roadbook></rally-raid-roadbook></div>
<div class="slot" id="rb2"><rally-raid-roadbook></rally-raid-roadbook></div>
<div class="slot" id="rb3"><rally-raid-roadbook></rally-raid-roadbook></div>
<script>
function send(id, name, data) { var el = document.querySelector('#' + id + ' > *'); var sc = angular.element(el); (sc.isolateScope() || sc.scope()).$broadcast(name, data) }
window.feed = function (S) { Object.keys(S).forEach(function (k) { S[k].forEach(function (m) { send(k, m[0], m[1]) }) }) }
</script>
</body></html>
