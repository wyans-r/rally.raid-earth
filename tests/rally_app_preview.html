<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>rally.raid Earth Rally preview (outside the game)</title>
<link rel="icon" href="data:,">
<script src="https://unpkg.com/angular@1.8.3/angular.min.js"></script>

<script>

var calls = []
window.bngApi = { engineLua: function (cmd) { calls.push(cmd) } }
angular.module('beamng.apps', [])
</script>
<script src="/ui/modules/apps/RallyRaidGPS/app.js"></script><script src="/tests/panel_shim.js"></script>
</head>
<body ng-app="beamng.apps">
<div class="slot" id="a"><rally-raid-rally></rally-raid-rally></div>
<div class="slot" id="b"><rally-raid-rally></rally-raid-rally></div>
<div class="slot" id="c"><rally-raid-rally></rally-raid-rally></div>
<script>
var DISC = 'Inspired by the 2027 Dakar route. Unofficial, not affiliated.'
function days() {
  return [
    { n: 1, date: '2027-01-09', type: 'stage', code: 'P', title: 'Prologue Loulé-Faro', from: 'Loulé-Faro', to: 'Loulé-Faro', ssKm: 30.5,

      liaisonOut: { km: 90, allowanceMin: 120, drive: true }, liaisonIn: { km: 80, allowanceMin: 110, drive: true }, progress: {} }
  ]
}
var STATES = {
  a: { experimental: true, loaded: false, list: [{ path: '/rallyraid/rallies/atlantic-to-atlas-2027.rally.json', id: 'atlantic-to-atlas-2027', name: 'Atlantic to Atlas 2027', days: 15, startDate: '2027-01-09', disclaimer: DISC }] },

}
function send(id, data) { angular.element(document.querySelector('#' + id + ' .rrl-host')).isolateScope().$broadcast('RallyRaidRally', data) }
setTimeout(function () { Object.keys(STATES).forEach(function (k) { send(k, STATES[k]) }) }, 300)
